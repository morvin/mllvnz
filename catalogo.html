<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - Il Mio Archivio</title>
    <meta name="description" content="Tutti i contenuti dell'archivio, divisi per categoria.">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:site_name" content="Il Mio Archivio">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Catalogo - Il Mio Archivio">
    <meta property="og:description" content="Tutti i contenuti dell'archivio, divisi per categoria.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='2.5' y='2.5' width='11' height='11' fill='none' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
    <a href="#main-content" class="skip-link">Salta al contenuto principale</a>

    <header class="site-header">
        <h1>Il Mio Archivio</h1>
        <p>Un posto per collezionare le mie cose.</p>
        <p class="site-nav"><a href="./">Torna all'archivio</a></p>
    </header>

    <main id="main-content" class="container container-wide">
        <h2 id="catalog-title">Catalogo</h2>
        <p id="catalog-count" class="post-date"></p>

        <noscript>
            <p class="noscript-msg">
                Questa pagina ha bisogno di JavaScript per mostrare il catalogo.
                Attivalo nel browser per sfogliare i contenuti.
            </p>
        </noscript>

        <div id="filters" class="filters">
            <nav class="filter-group" aria-label="Filtra per categoria">
                <h3 class="filter-label">Categoria</h3>
                <ul id="filter-category" class="filter-list"></ul>
            </nav>
            <nav class="filter-group" aria-label="Filtra per tipo">
                <h3 class="filter-label">Tipo</h3>
                <ul id="filter-type" class="filter-list"></ul>
            </nav>
            <nav class="filter-group" aria-label="Filtra per lingua">
                <h3 class="filter-label">Lingua</h3>
                <ul id="filter-lang" class="filter-list"></ul>
            </nav>
        </div>

        <p id="catalog-status" class="catalog-status" role="status" aria-live="polite"></p>

        <div id="catalog"></div>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="footer-year">2026</span> Il Mio Archivio.</p>
    </footer>

    <script src="common.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
