<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Il Mio Archivio</title>
    <meta id="meta-desc" name="description" content="Un archivio di immagini e link.">
    <meta name="theme-color" content="#ffffff">

    <!-- Anteprima per social e app di messaggistica -->
    <meta property="og:site_name" content="Il Mio Archivio">
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="Il Mio Archivio">
    <meta id="og-desc" property="og:description" content="Un archivio di immagini e link.">
    <meta id="og-url" property="og:url" content="">
    <meta id="og-image" property="og:image" content="">
    <meta id="tw-card" name="twitter:card" content="summary">

    <link rel="canonical" id="canonical" href="">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='2.5' y='2.5' width='11' height='11' fill='none' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
    <a href="#main-content" class="skip-link">Salta al contenuto principale</a>

    <header class="site-header">
        <h1>Il Mio Archivio</h1>
        <p>Un posto per collezionare le mie cose.</p>
    </header>

    <main id="main-content" class="container">
        <article class="content-post">
            <h2 id="post-title">Caricamento...</h2>
            <p id="post-date" class="post-date"></p>

            <noscript>
                <p class="noscript-msg">
                    Questo archivio ha bisogno di JavaScript per mostrare i contenuti.
                    Attivalo nel browser per sfogliare le pagine.
                </p>
            </noscript>

            <!-- Navigazione Superiore -->
            <nav id="nav-top" class="post-nav" aria-label="Navigazione contenuti principale">
                <ul>
                    <li><a href="#" class="nav-btn nav-first" aria-label="Primo contenuto">|&lt; Primo</a></li>
                    <li><a href="#" class="nav-btn nav-prev" aria-label="Contenuto precedente">&lt; Indietro</a></li>
                    <li><button type="button" class="nav-btn nav-random" id="btn-random" aria-label="Contenuto casuale">Casuale</button></li>
                    <li><a href="#" class="nav-btn nav-next" aria-label="Contenuto successivo">Avanti &gt;</a></li>
                    <li><a href="#" class="nav-btn nav-last" aria-label="Ultimo contenuto">Ultimo &gt;|</a></li>
                </ul>
            </nav>

            <!-- Area Contenuto (Immagine, eventualmente cliccabile, oppure Link) -->
            <div class="content-media">
                <a id="image-link" class="image-link" target="_blank" rel="noopener">
                    <img id="main-image" src="" alt="" decoding="async" hidden>
                </a>
                <a id="main-link" href="" class="big-link" target="_blank" rel="noopener"></a>
            </div>

            <!-- Navigazione Inferiore (ripetuta, nascosta agli screen reader) -->
            <nav class="post-nav" aria-hidden="true">
                <ul>
                    <li><a href="#" class="nav-btn nav-first" tabindex="-1">|&lt; Primo</a></li>
                    <li><a href="#" class="nav-btn nav-prev" tabindex="-1">&lt; Indietro</a></li>
                    <li><button type="button" class="nav-btn nav-random" tabindex="-1">Casuale</button></li>
                    <li><a href="#" class="nav-btn nav-next" tabindex="-1">Avanti &gt;</a></li>
                    <li><a href="#" class="nav-btn nav-last" tabindex="-1">Ultimo &gt;|</a></li>
                </ul>
            </nav>

            <!-- Testo / Trascrizione -->
            <div class="content-text">
                <h3 id="content-caption">Dettagli</h3>
                <p id="post-desc"></p>
            </div>
        </article>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="footer-year">2026</span> Il Mio Archivio.</p>
    </footer>

    <!-- Colleghiamo il file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
