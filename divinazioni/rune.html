:root{
--paper:#f7f6f2;
--paper-deep:#efeee7;
--ink:#1b201d;
--ink-soft:#4a534d;
--indigo:#33485c;
--cinnabar:#a83a2a;
--bronze:#8a8360;
--rule:rgba(27,32,29,.16);
--serif:"Palatino Linotype",Palatino,"Iowan Old Style","Book Antiqua",Georgia,serif;
--body:Georgia,"Times New Roman",serif;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--paper);
color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;
-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:38px 26px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.backlink{margin:0 0 14px}
.backlink a{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);text-decoration:none;border-bottom:1px solid transparent;transition:color .25s ease,border-color .25s ease}
.backlink a:hover{color:var(--indigo);border-bottom-color:var(--indigo)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);margin:0 0 10px}
.lang{display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:0 0 auto}
.lang button{
background:transparent;border:0;border-right:1px solid var(--rule);padding:6px 11px;cursor:pointer;
font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)
}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--indigo);color:#f2f2ec}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.06;margin:0 0 6px;letter-spacing:-.01em}
h1 .glyph{font-family:var(--serif);font-style:italic;font-size:.78em;margin-right:.28em;color:var(--indigo)}
.lede{margin:0 0 34px;color:var(--ink-soft);max-width:54ch}
label.field{display:block;margin-bottom:22px}
label.field > span,.flabel{
display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
text-transform:uppercase;color:var(--bronze);margin-bottom:8px
}
textarea{
width:100%;min-height:78px;resize:vertical;background:rgba(255,255,255,.42);
border:1px solid var(--rule);border-radius:2px;padding:12px 14px;
font-family:var(--body);font-size:17px;line-height:1.5;color:var(--ink)
}
textarea:focus,button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;width:max-content;max-width:100%}
.seg button{
background:transparent;border:0;border-right:1px solid var(--rule);padding:9px 16px;cursor:pointer;
font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#f2f2ec}
.method-note{font-size:14px;color:var(--ink-soft);margin:10px 0 0;max-width:54ch}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px}
button.cast{background:var(--ink);color:#eceade;border:0;border-radius:2px;padding:13px 26px;cursor:pointer;font-family:var(--serif);font-size:17px}
button.cast:hover{background:var(--indigo)}
button.cast[disabled]{opacity:.45;cursor:default}
button.ghost{background:transparent;border:1px solid var(--rule);border-radius:2px;padding:11px 18px;cursor:pointer;font-family:var(--serif);font-size:16px;color:var(--ink)}
button.ghost:hover{border-color:var(--indigo);color:var(--indigo)}
button.ghost[disabled]{opacity:.4;cursor:default}

.stage{position:relative;margin:40px 0 0}
.cardblock{position:relative;padding:18px 0 6px}
.watermark{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-family:'Noto Sans Runic',"Segoe UI Historic","Segoe UI Symbol",var(--serif);font-style:normal;
font-size:220px;line-height:.8;color:rgba(51,72,92,.09);pointer-events:none;user-select:none;white-space:nowrap}

.spread{position:relative;display:flex;gap:22px;justify-content:flex-start;align-items:flex-end;flex-wrap:wrap}
.spread.single{width:min(320px,86vw)}
.spread.three{width:min(820px,98vw)}
.cardslot{flex:1 1 0;min-width:150px;max-width:280px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(8px)}
.cardslot.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.poslabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);text-align:center}

.cardface-wrap{perspective:900px}
.card3d{position:relative;width:100%;aspect-ratio:5/8;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.card3d.flipped{transform:rotateY(180deg)}
.cardside{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rule);border-radius:5px;
display:flex;align-items:center;justify-content:center;overflow:hidden}
.cardback{background:
 repeating-linear-gradient(135deg, rgba(51,72,92,.14) 0 8px, rgba(51,72,92,.05) 8px 16px),
 var(--indigo)}
.cardback::after{content:"✦";font-family:var(--serif);font-style:italic;color:rgba(242,242,236,.85);font-size:28px}
.cardfront{background:var(--paper);transform:rotateY(180deg);padding:10px 6px;flex-direction:column}
.cardfront .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .3s;height:100%;width:100%}
.card3d.reversed .cardfront .inner{transform:rotate(180deg)}
.cf-num{font-family:var(--mono);font-size:12px;color:var(--bronze);letter-spacing:.1em}
.cf-glyph{font-family:'Noto Sans Runic',"Segoe UI Historic","Segoe UI Symbol",var(--serif);font-style:normal;font-size:56px;color:var(--indigo)}
.cf-img{max-width:90%;max-height:72%;object-fit:contain;border:1px solid var(--rule);background:#fff;display:none}
.cf-img.on{display:block}
.cf-name{font-family:var(--serif);font-size:17px;text-align:center;line-height:1.15;padding:0 4px}
.cf-orient{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinnabar)}

.deckpicker{display:flex;gap:9px;flex-wrap:wrap}
.deckopt{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:1px solid var(--rule);
border-radius:3px;padding:6px 6px 7px;cursor:pointer;width:66px}
.deckopt:hover{border-color:var(--bronze)}
.deckopt img{width:42px;height:auto;display:block;border:1px solid var(--rule);border-radius:2px;background:#fff}
.deckopt .glyph-mini{width:42px;height:56px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
font-style:italic;color:var(--indigo);font-size:19px;border:1px solid var(--rule);border-radius:2px;background:rgba(51,72,92,.05)}
.deckopt span.lbl{font-family:var(--mono);font-size:8px;letter-spacing:0;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.25;min-width:0;width:100%;white-space:normal;overflow-wrap:break-word;hyphens:auto}
.deckopt[aria-pressed="true"]{border-color:var(--indigo);background:rgba(51,72,92,.05)}
.deckopt[aria-pressed="true"] span.lbl{color:var(--indigo)}

.namebar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:26px 0 2px}
.namebar .num{font-family:var(--mono);font-size:12px;color:var(--bronze);letter-spacing:.16em}
.namebar .glyph{font-family:'Noto Sans Runic',"Segoe UI Historic","Segoe UI Symbol",var(--serif);font-style:normal;font-size:34px;line-height:1;color:var(--indigo)}
.namebar .it{font-family:var(--serif);font-size:26px}
.namebar .key{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
.namebar .orient{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinnabar)}

.sec{margin:30px 0 0}
.sec h3{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);font-weight:400;margin:0 0 8px}
.sec p{margin:0 0 10px}
.judgment{font-family:var(--serif);font-size:21px;line-height:1.5}

.pos-list{list-style:none;margin:0;padding:0}
.pos-list li{border-left:2px solid var(--cinnabar);padding:2px 0 10px 16px;margin:0 0 16px}
.pos-list b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
color:var(--cinnabar);font-weight:400;margin-bottom:3px}
.pos-list .pname{font-family:var(--serif);font-size:19px;margin:2px 0 4px}
.pos-list .pmeaning{font-size:16px}

.into{border-top:1px solid var(--rule);padding-top:22px;margin-top:32px}
.q-echo{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--indigo);margin:0 0 4px}
.reading{white-space:pre-wrap;font-size:16.5px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}

.export-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.export-row:first-of-type{margin-top:22px}
.export-row + .export-row{margin-top:12px}
.export-row button.ghost{padding:9px 15px;font-size:14.5px}
.export-row .flabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);margin:0}
.share-link{font-family:var(--serif);font-size:14px;color:var(--indigo);text-decoration:none;
 border:1px solid var(--rule);border-radius:2px;padding:8px 13px;cursor:pointer;background:transparent;line-height:1}
.share-link:hover{border-color:var(--indigo);background:rgba(51,72,92,.05)}
.export-status{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--bronze);opacity:0;transition:opacity .4s ease}

.log{margin-top:56px}
.log h3{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);font-weight:400;margin:0 0 4px}
.log-entry{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);
padding:9px 0;font-family:var(--body);font-size:14.5px;color:var(--ink-soft)}
.log-entry .k{font-family:var(--mono);font-size:11px;color:var(--bronze);letter-spacing:.1em;margin-right:8px}

footer{margin-top:64px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;max-width:60ch}

@media (max-width:560px){.watermark{font-size:120px;opacity:.7}.wrap{padding:28px 20px 80px}.spread.three{gap:12px}}
@media (prefers-reduced-motion:reduce){.cardslot,.cardslot.in,.card3d{transition:none}.cardslot.in{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div>
<p class="backlink"><a href="./" id="t-back"></a></p>
<p class="eyebrow" id="t-eyebrow"></p>
</div>
<div class="lang" role="group" aria-label="Lingua / Language">
<button type="button" id="l-it" aria-pressed="true">IT</button>
<button type="button" id="l-en" aria-pressed="false">EN</button>
</div>
</div>
<h1><span class="glyph">✦</span><span id="t-title"></span></h1>
<p class="lede" id="t-lede"></p>

<label class="field">
<span id="t-qlabel"></span>
<textarea id="q"></textarea>
</label>

<div style="margin-bottom:0">
<span class="flabel" id="t-method"></span>
<div class="seg" role="group">
<button type="button" id="m-single" aria-pressed="true"></button>
<button type="button" id="m-three" aria-pressed="false"></button>
</div>
</div>
<p class="method-note" id="mnote"></p>

<div style="margin-bottom:0;margin-top:22px;display:none">
<span class="flabel" id="t-deck"></span>
<div class="deckpicker" id="deckpicker" role="group"></div>
</div>

<div class="actions">
<button class="cast" id="cast"></button>
<button class="ghost" id="again" style="display:none"></button>
</div>

<div class="stage" id="stage" aria-live="polite"></div>

<div class="log" id="log" style="display:none">
<h3 id="t-log"></h3>
<div id="log-entries"></div>
</div>

<footer id="t-foot"></footer>
</div>

<script>
const RUNES = [
{n:0,glyph:"\u16A0",name:"Fehu",it:"Fehu",en:"Fehu",key:"La ricchezza guadagnata",keyEn:"Wealth earned by hand",
up:"Un raccolto che si pu\u00f2 toccare con mano, frutto di lavoro pi\u00f9 che di fortuna. Prosperit\u00e0 che circola, non che si accumula soltanto.",
upEn:"A harvest you can hold in your hands, born of labor more than luck. Prosperity that circulates, not merely piles up.",

revEn:"Wealth slipping through the fingers, or a possession that has stopped nourishing the one who holds it.",
lore:"Il nome significa \u201cbestiame\u201d: nelle societ\u00e0 del Nord era la prima forma di moneta, la ricchezza che cammina sulle proprie gambe.",
loreEn:"The name means \u201ccattle\u201d: in the societies of the North it was the earliest form of currency, wealth that walks on its own legs.",
reversible:true},
{n:1,glyph:"\u16A2",name:"Uruz",it:"Uruz",en:"Uruz",key:"La forza selvatica",keyEn:"Untamed strength",

rev:"Un vigore speso male, o la fatica di chi ha smesso di ascoltare il proprio corpo.",

{n:2,glyph:"\u16A6",name:"Thurisaz",it:"Thurisaz",en:"Thurisaz",key:"La soglia pericolosa",keyEn:"The dangerous threshold",

rev:"Un pericolo subito senza difesa, o una collera che si ritorce contro chi la porta.",

{n:3,glyph:"\u16A8",name:"Ansuz",it:"Ansuz",en:"Ansuz",key:"Il messaggio ricevuto",keyEn:"The message received",

{n:5,glyph:"\u16B2",name:"Kenaz",it:"Kenaz",en:"Kenaz",key:"La luce controllata",keyEn:"Controlled light",

{n:8,glyph:"\u16BA",name:"Hagalaz",it:"Hagalaz",en:"Hagalaz",key:"La tempesta necessaria",keyEn:"The necessary storm",

lore:"La grandine cade uguale su ogni campo: una runa che non conosce rovescio, perch\u00e9 il cambiamento che porta non si pu\u00f2 addolcire guardandola da un altro verso.",

{n:9,glyph:"\u16BE",name:"Naudiz",it:"Naudiz",en:"Naudiz",key:"Il limite che insegna",keyEn:"The limit that teaches",

{n:10,glyph:"\u16C1",name:"Isa",it:"Isa",en:"Isa",key:"La sosta immobile",keyEn:"The still pause",

{n:11,glyph:"\u16C3",name:"Jera",it:"Jera",en:"Jera",key:"Il tempo che matura",keyEn:"Time that ripens",

{n:13,glyph:"\u16C8",name:"Perthro",it:"Perthro",en:"Perthro",key:"Il caso che rivela",keyEn:"Chance that reveals",

function artIt(prep, phrase){
 const p = phrase.toLowerCase();
 const map = { da:{ "il":"dal", "la":"dalla", "l'":"dall'" }, a:{ "il":"al", "la":"alla", "l'":"all'" } };
 let art=null, rest=p;
 if(p.startsWith("l'")){ art="l'"; rest=p.slice(2); }
 else if(p.startsWith("il ")){ art="il"; rest=p.slice(3); }
 else if(p.startsWith("la ")){ art="la"; rest=p.slice(3); }
 if(art && map[prep] && map[prep][art]){
  const contracted = map[prep][art];
  return contracted.endsWith("'") ? contracted+rest : contracted+' '+rest;
 }
 return prep+' '+p;
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function drawCards(m){
 const pool = RUNES.slice();
 const n = m==='three' ? 3 : 1;
 const chosen = [];
 for(let i=0;i<n;i++){
  const idx = Math.floor(Math.random()*pool.length);
  const card = pool.splice(idx,1)[0];
  // Alcune rune (Gebo, Hagalaz, Isa, Jera, Eihwaz, Sowilo, Ingwaz, Dagaz) sono
  // tradizionalmente simmetriche e non hanno un significato "capovolto": per
  // quelle l'orientamento è sempre dritto.
  chosen.push({card, reversed: card.reversible ? Math.random()<0.5 : false});
 }
 if(m==='three'){
  chosen[0].pos='past'; chosen[1].pos='present'; chosen[2].pos='future';
 }
 return chosen;
}

function composeReading(question, draws, m, l){
 const P = PHRASES[l];
 const q = (question||'').trim();
 let out = q ? pick(P.openQ)(q) : pick(P.openNoQ)();
 out += '\n\n';
 if(m==='single'){
  const d = draws[0];
  const card = d.card;
  const name = l==='it'?card.it:card.en;
  const key = l==='it'?card.key:card.keyEn;
  const meaning = d.reversed ? (l==='it'?card.rev:card.revEn) : (l==='it'?card.up:card.upEn);
  const lore = l==='it'?card.lore:card.loreEn;
  const orient = d.reversed ? ` (${TR[l].reversed.toLowerCase()})` : '';
  out += `${name}${orient} — ${key}. ${meaning}\n\n`;
  out += `${lore}\n\n`;
  out += pick(P.reflection)(key) + '\n\n';
  out += (d.reversed ? pick(P.adviceReversed)(key) : pick(P.adviceUpright)(key)) + '\n\n';
  out += pick(P.closeSingle)();
 } else {
  const labels = TR[l].positions;
  draws.forEach(d=>{
   const card = d.card;
   const name = l==='it'?card.it:card.en;
   const key = l==='it'?card.key:card.keyEn;
   const meaning = d.reversed ? (l==='it'?card.rev:card.revEn) : (l==='it'?card.up:card.upEn);
   const orient = d.reversed ? ` (${TR[l].reversed.toLowerCase()})` : '';
   out += `${labels[d.pos]}: ${name}${orient}. ${meaning}\n\n`;
  });
  const k1 = l==='it'?draws[0].card.key:draws[0].card.keyEn;
  const k2 = l==='it'?draws[1].card.key:draws[1].card.keyEn;
  const k3 = l==='it'?draws[2].card.key:draws[2].card.keyEn;
  out += pick(P.synthesis)(k1,k2,k3) + '\n\n';
  out += pick(P.reflectionThree)(k1,k2,k3) + '\n\n';
  out += pick(P.adviceThree)(k3) + '\n\n';
  out += pick(P.closeSingle)();
 }
 return out;
}

   ? `<span class="glyph-mini">✦</span>`

  return `<button type="button" class="deckopt" data-deck="${d.key}" aria-pressed="${d.key===deckStyle}">${thumb}<span class="lbl">${label}</span></button>`;
 }).join('');

   slot.appendChild(pl);
  }
  const wrap = document.createElement('div');
  wrap.className = 'cardface-wrap';
  const c3 = document.createElement('div');
  c3.className = 'card3d';
  c3.innerHTML = `<div class="cardside cardback"></div><div class="cardside cardfront"><div class="inner"><div class="cf-num"></div><div class="cf-glyph">✦</div><img class="cf-img" alt=""><div class="cf-name"></div><div class="cf-orient"></div></div></div>`;
  wrap.appendChild(c3);
  slot.appendChild(wrap);
  spread.appendChild(slot);
  slots.push({slot, c3});
 }
 block.appendChild(spread);
 stage.appendChild(block);

 const status = document.createElement('p');
 status.className = 'status';
 status.id = 'stage-status';
 status.textContent = TR[lang].statusDraw;
 stage.appendChild(status);

 return slots;
}

function fillFront(c3, d){
 const card = d.card;
 const name = lang==='it'?card.it:card.en;
 c3.querySelector('.cf-num').textContent = card.r;
 c3.querySelector('.cf-name').textContent = name;
 c3.querySelector('.cf-orient').textContent = d.reversed ? TR[lang].reversed : '';
 const glyphEl = c3.querySelector('.cf-glyph');
 const imgEl = c3.querySelector('.cf-img');
 glyphEl.style.display = '';
 glyphEl.textContent = card.glyph;
 imgEl.classList.remove('on');
 imgEl.removeAttribute('src');
 if(d.reversed) c3.classList.add('reversed'); else c3.classList.remove('reversed');
}

function renderResults(draws, m, skipWatermark){
 const stage = $('stage');
 let results = stage.querySelector('.results');
 if(results) results.remove();
 results = document.createElement('div');
 results.className = 'results';

 if(m==='single'){
  const d = draws[0];
  const card = d.card;
  const name = lang==='it'?card.it:card.en;
  const key = lang==='it'?card.key:card.keyEn;
  const meaning = d.reversed ? (lang==='it'?card.rev:card.revEn) : (lang==='it'?card.up:card.upEn);
  const lore = lang==='it'?card.lore:card.loreEn;
  results.innerHTML = `
   <div class="namebar">
    <span class="num">${card.r}</span>
    <span class="glyph">${card.glyph}</span>
    <span class="it">${name}</span>
    <span class="key">${key}</span>
    ${d.reversed?`<span class="orient">${TR[lang].reversed}</span>`:''}
   </div>
   <div class="sec"><h3>${TR[lang].meaning}</h3><p class="judgment">${meaning}</p></div>
   <div class="sec"><h3>${TR[lang].image}</h3><p>${lore}</p></div>
  `;
 } else {
  const labels = TR[lang].positions;
  const items = draws.map(d=>{
   const card = d.card;
   const name = lang==='it'?card.it:card.en;
   const meaning = d.reversed ? (lang==='it'?card.rev:card.revEn) : (lang==='it'?card.up:card.upEn);
   return `<li><b>${labels[d.pos]}</b><div class="pname">${card.r} · ${name}${d.reversed?` — ${TR[lang].reversed}`:''}</div><div class="pmeaning">${meaning}</div></li>`;
  }).join('');
  results.innerHTML = `<ul class="pos-list">${items}</ul>`;
 }

 const block = stage.querySelector('.cardblock');
 if(!skipWatermark && m==='single'){
  const wm = document.createElement('span');
  wm.className = 'watermark';
  wm.textContent = draws[0].card.glyph;
  block.appendChild(wm);
 } else if(block && block.querySelector('.watermark') && m==='single'){
  block.querySelector('.watermark').textContent = draws[0].card.glyph;
 }

 stage.appendChild(results);
}

function buildShareSnippet(entry){
 const l = lang;
 const t = TR[l];
 const cardNames = entry.draws.map(d=>{
  const name = l==='it' ? d.card.it : d.card.en;
  return d.reversed ? `${name} (${t.reversed.toLowerCase()})` : name;
 }).join(', ');
 const q = entry.question ? `“${entry.question}” — ` : '';
 const suffix = l==='it' ? ' · Lettura delle Rune' : ' · Rune reading';
 return `${q}${cardNames}${suffix} — ${PAGE_URL}`;
}

function renderReadingBox(entry){
 const stage = $('stage');
 let into = stage.querySelector('.into');
 if(into) into.remove();
 into = document.createElement('div');
 into.className = 'into';
 into.id = 'into-block';


 // Se la lettura estesa era già stata composta in un'altra lingua, la si
 // rigenera nella lingua corrente invece di lasciarla incoerente col resto.
 const text = (entry.readingText && entry.readingLang===lang) ? entry.readingText : composeReading(entry.question, entry.draws, entry.method, lang);
 entry.readingText = text;
 entry.readingLang = lang;
 const snippet = buildShareSnippet(entry);
 const encSnippet = encodeURIComponent(snippet);
 const encTitle = encodeURIComponent(lang==='it' ? 'La mia lettura delle rune' : 'My rune reading');
 const waHref = `https://wa.me/?text=${encSnippet}`;
 const tgHref = `https://t.me/share/url?url=${encodeURIComponent(PAGE_URL)}&text=${encSnippet}`;
 const xHref = `https://twitter.com/intent/tweet?text=${encSnippet}`;
 const mailHref = `mailto:?subject=${encTitle}&body=${encodeURIComponent(text + '\n\n' + PAGE_URL)}`;
 into.innerHTML = `
  <h3 class="flabel">${TR[lang].reading}</h3>
  ${entry.question?`<p class="q-echo">“${entry.question}”</p>`:''}
  <p class="reading">${text}</p>
  <div class="export-row">
   <button type="button" class="ghost" id="save-txt">${TR[lang].saveBtn}</button>
   <button type="button" class="ghost" id="share-reading">${TR[lang].shareBtn}</button>
  </div>
  <div class="export-row share-links">
   <span class="flabel" style="margin:0">${TR[lang].shareOnLabel}</span>
   <a class="share-link" href="${waHref}" target="_blank" rel="noopener">WhatsApp</a>
   <a class="share-link" href="${tgHref}" target="_blank" rel="noopener">Telegram</a>
   <a class="share-link" href="${xHref}" target="_blank" rel="noopener">X</a>
   <button type="button" class="share-link" id="share-fb">Facebook</button>
   <a class="share-link" href="${mailHref}" target="_blank" rel="noopener">Email</a>
  </div>
  <div class="export-row"><span class="export-status" id="export-status"></span></div>
 `;
 stage.appendChild(into);
 into.querySelector('#save-txt').addEventListener('click', ()=>saveTxt(entry));
 into.querySelector('#share-reading').addEventListener('click', ()=>shareReading(entry));
 into.querySelector('#share-fb').addEventListener('click', ()=>shareToFacebook(entry));
}

function buildExportText(entry){
 const l = lang;
 const t = TR[l];
 const methodLabel = entry.method==='single' ? t.mSingle : t.mThree;
 const now = new Date();
 const locale = l==='it' ? 'it-IT' : 'en-US';
 const dateOnly = now.toLocaleDateString(locale, {day:'2-digit', month:'2-digit', year:'numeric'});
 const timeOnly = now.toLocaleTimeString(locale, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
 const lines = [];
 lines.push(t.headerTitle);
 lines.push(`${t.dateLabel}: ${dateOnly} — ${t.timeLabel}: ${timeOnly}`);
 lines.push('');
 lines.push(`${t.spreadLabel}: ${methodLabel}`);
 if(entry.question) lines.push(`${t.questionLabel}: ${entry.question}`);
 lines.push('');
 if(entry.method==='single'){
  const d = entry.draws[0];
  const card = d.card;
  const name = l==='it'?card.it:card.en;
  const meaning = d.reversed ? (l==='it'?card.rev:card.revEn) : (l==='it'?card.up:card.upEn);
  const lore = l==='it'?card.lore:card.loreEn;
  lines.push(`${card.r} · ${name}${d.reversed?' — '+t.reversed:''}`);
  lines.push(meaning);
  lines.push(lore);
 } else {
  const labels = t.positions;
  entry.draws.forEach(d=>{
   const card = d.card;
   const name = l==='it'?card.it:card.en;
   const meaning = d.reversed ? (l==='it'?card.rev:card.revEn) : (l==='it'?card.up:card.upEn);
   lines.push(`${labels[d.pos]}: ${card.r} · ${name}${d.reversed?' — '+t.reversed:''}`);
   lines.push(meaning);
   lines.push('');
  });
 }
 lines.push('');
 lines.push(t.reading + ':');
 lines.push(entry.readingText || composeReading(entry.question, entry.draws, entry.method, l));
 lines.push('');
 lines.push(t.foot);
 return lines.join('\n');
}

function showExportStatus(msg){
 const el = document.getElementById('export-status');
 if(!el) return;
 el.textContent = msg;
 el.style.opacity = '1';
 clearTimeout(showExportStatus._t);
 showExportStatus._t = setTimeout(()=>{ el.style.opacity = '0'; }, 4500);
}

function buildFilename(){
 const now = new Date();
 const pad = n => String(n).padStart(2,'0');
 const datePart = `${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`;
 const timePart = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
 return `runeconsult-${datePart}_${timePart}.txt`;
}

function saveTxt(entry){
 const text = buildExportText(entry);
 const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = buildFilename();
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(()=>URL.revokeObjectURL(url), 2000);
 showExportStatus(TR[lang].savedMsg);
}

async function shareReading(entry){
 const text = buildExportText(entry);
 const title = lang==='it' ? 'La mia lettura delle rune' : 'My rune reading';
 try{
  if(navigator.canShare){
   const file = new File([text], buildFilename(), {type:'text/plain'});
   if(navigator.canShare({files:[file]})){
    await navigator.share({title, text, files:[file]});
    showExportStatus(TR[lang].sharedMsg);
    return;
   }
  }
  if(navigator.share){
   await navigator.share({title, text});
   showExportStatus(TR[lang].sharedMsg);
   return;
  }
  throw new Error('no-share-api');
 } catch(err){
  if(err && err.name==='AbortError') return;
  try{
   await navigator.clipboard.writeText(text);
   showExportStatus(TR[lang].shareFallbackMsg);
  } catch(e2){
   showExportStatus(TR[lang].shareFailMsg);
  }
 }
}

async function shareToFacebook(entry){
 // Facebook's share dialog only accepts a URL, not arbitrary post text, so the
 // most reliable path is to copy the reading to the clipboard and open Facebook,
 // letting the person paste it into a new post themselves.
 const snippet = buildShareSnippet(entry);
 try{
  await navigator.clipboard.writeText(snippet);
  showExportStatus(TR[lang].fbMsg);
 } catch(e){
  showExportStatus(TR[lang].shareFailMsg);
 }
 window.open('https://www.facebook.com/', '_blank', 'noopener');
}

function renderLog(){
 const wrap = $('log');
 const entries = $('log-entries');
 if(history.length===0){ wrap.style.display='none'; return; }
 wrap.style.display = '';
 entries.innerHTML = history.slice().reverse().map(h=>{
  const names = h.draws.map(d=>{
   const n = lang==='it'?d.card.it:d.card.en;
   return d.reversed ? n+'↩' : n;
  }).join(', ');
  const mLabel = h.method==='single' ? TR[lang].mSingle : TR[lang].mThree;
  const qSnippet = h.question ? `“${h.question.length>60?h.question.slice(0,60)+'…':h.question}”` : (lang==='it'?'(nessuna domanda)':'(no question)');
  return `<div class="log-entry"><span class="k">${mLabel}</span>${qSnippet} — ${names}</div>`;
 }).join('');
}

async function runCast(){
 if(busy) return;
 busy = true;
 $('cast').setAttribute('disabled','');
 $('again').style.display = 'none';

 const question = $('q').value.trim();
 const slots = buildStage(method);
 const draws = drawCards(method);

 // stagger the flip-in of each slot, then flip each card
 for(let i=0;i<slots.length;i++){
  await wait(i===0?120:260);
  slots[i].slot.classList.add('in');
  await wait(180);
  fillFront(slots[i].c3, draws[i]);
  slots[i].c3.classList.add('flipped');
 }

 await wait(500);
 const statusEl = $('stage-status');
 if(statusEl) statusEl.textContent = TR[lang].statusRead;
 await wait(650);
 if(statusEl) statusEl.remove();

 renderResults(draws, method, false);
 const entry = {
  id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)),
  question, method, draws,
  deckStyle, lang
 };
 lastDraw = entry;
 renderReadingBox(entry);

 history.push(entry);
 if(history.length>12) history.shift();
 renderLog();

 $('cast').removeAttribute('disabled');
 $('again').style.display = '';
 busy = false;
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

$('l-it').addEventListener('click', ()=>setLang('it'));
$('l-en').addEventListener('click', ()=>setLang('en'));
$('m-single').addEventListener('click', ()=>setMethod('single'));
$('m-three').addEventListener('click', ()=>setMethod('three'));
$('cast').addEventListener('click', runCast);
$('again').addEventListener('click', runCast);

$('l-it').setAttribute('aria-pressed', lang==='it');
$('l-en').setAttribute('aria-pressed', lang==='en');
applyStaticText();
</script>
