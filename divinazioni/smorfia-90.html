 tradition:[
  ["Che cos'è la Smorfia",
   "La Smorfia è un dizionario: da una parte le cose del mondo — i sogni, gli oggetti, le persone, i fatti — e dall'altra i novanta numeri del lotto. Non promette di sapere il futuro. Fa una cosa più modesta e più interessante: prende il racconto di un sogno e lo scompone in figure, e a ogni figura dà un numero. Il salto dal numero alla giocata è un'altra faccenda, ed è sempre stata una scommessa, non una previsione."],
  ["Da dove viene il nome",
   "L'etimologia non è certa. La spiegazione più ripetuta lega la parola a Morfeo, il dio greco dei sogni: sarebbe la disciplina che traduce le visioni notturne. È una spiegazione affascinante e nessuno l'ha mai dimostrata; conviene prenderla per quello che è, una tradizione sull'origine di una tradizione."],
  ["Le radici",
   "Tra le ipotesi più accreditate c'è quella che collega la Smorfia alla Cabala ebraica e in particolare alla gematria, la pratica di associare valori numerici alle lettere per cercare significati nascosti nei testi sacri. L'ipotesi vuole che sia arrivata a Napoli con gli ebrei sefarditi cacciati dalla Spagna alla fine del Quattrocento. Più indietro ancora ci sono i libri antichi sull'interpretazione dei sogni, come quello di Artemidoro di Daldi. Quel che è certo è che a Napoli tutto questo è diventato altro: popolare, comico, sfacciato, molto più vicino alla strada che alla mistica."],
  ["Perché proprio novanta",
   "Perché novanta sono le palline del lotto. Il gioco nasce a Genova nel Cinquecento e viene legalizzato negli stati italiani nel Settecento; i suoi novanta numeri hanno dato alla Smorfia la sua griglia. Senza il lotto, la Smorfia non avrebbe avuto una forma."],
  ["La tombola, ovvero come un divieto inventò un gioco",
   "Nel 1734 a Napoli re Carlo di Borbone voleva ufficializzare il lotto: se restava clandestino, lo Stato non ci guadagnava nulla. Il domenicano padre Gregorio Maria Rocco si oppose, sostenendo che avrebbe allontanato la gente dalla preghiera, tanto più durante l'Avvento. Si arrivò a un compromesso: il banco pubblico restava chiuso nelle settimane di Natale. I napoletani si organizzarono in casa, con i numeri scritti a mano e un sacchetto per estrarli — il tombolo, quello del ricamo, da cui il nome. È così che il gioco proibito è diventato la tradizione natalizia più domestica che ci sia. Ed è per questo che i novanta significati della Smorfia e quelli della tombola sono gli stessi."],
  ["Le regole di chi ci credeva davvero",
   "Attorno al gioco dei sogni si erano formate regole precise, e severe. I numeri andavano giocati “puri”, senza mescolarli con altri; andavano seguiti per tre estrazioni di fila prima di abbandonarli; e soprattutto non si doveva raccontare a nessuno da quale sogno venissero, perché dirlo ne annullava l'efficacia. Sono regole che dicono molto: chi giocava sapeva benissimo di stare scommettendo, e si costruiva attorno una disciplina per rendere l'attesa sopportabile."],
  ["Oltre i novanta: il dizionario esteso",
   "I novanta nomi sono quelli della tombola, ma la Smorfia vera è molto più larga: ai novanta numeri manda ogni cosa del mondo, e i dizionari tradizionali arrivano a migliaia di voci. Il guaio è che non vanno d'accordo. Un elenco dà «gatto» al 66, mentre il 3 è letteralmente 'a jatta; un altro dà alla parola «acqua» quattro numeri diversi, e a «aceto» dieci. Va bene per un libro da sfogliare, non per uno strumento che deve sceglierne uno. Qui perciò si è seguita una regola sola, applicata a tutte le voci aggiunte: ogni parola va alla figura canonica che le somiglia di più. Il serpente va alla corda al collo, perché è quella la sua immagine; la scala alla caduta; il fuoco ai diavoletti; il telefono alla bocca, che è la parola che arriva da lontano; il cane alla gatta, perché la tradizione non gli ha dato un numero e quello è l'animale di casa. Dove la Smorfia tace, la scelta è nostra e la dichiariamo: non è la smorfia di nessun altro, ma è coerente con sé stessa e non contraddice mai i novanta."],
  ["Come si legge un sogno",
   "Il metodo è semplice: si scompone il racconto nelle sue figure e si cerca ciascuna nell'elenco. Le espressioni intere vengono prima delle parole singole — il 47 è il morto, ma il morto che parla è il 48, ed è un numero diverso. Non tutte le parole hanno un numero: la Smorfia canonica ne conosce novanta, e di un sogno può tradurne due, oppure nessuna. Nella tradizione si gioca una cinquina al massimo, ed è raro riempirla."]

 toolink:"← Back to the Smorfia",
 tabletitle:"From 1 to 90",
 tablenote:"The Neapolitan names are those of the tombola: some are blunt, others are periphrases invented precisely so as not to name the thing. They are given as tradition handed them down.",
 colN:"No.", colNap:"Neapolitan", colMean:"Meaning",
 tradition:[
  ["What the Smorfia is",
   "The Smorfia is a dictionary: on one side the things of the world — dreams, objects, people, events — and on the other the ninety numbers of the lottery. It does not promise to know the future. It does something more modest and more interesting: it takes the account of a dream, breaks it into figures, and gives each figure a number. The leap from number to wager is another matter, and it has always been a bet, not a forecast."],
  ["Where the name comes from",
   "The etymology is uncertain. The most repeated explanation ties the word to Morpheus, the Greek god of dreams: the discipline that translates night visions. It is a charming explanation and nobody has ever proved it; better to take it for what it is, a tradition about the origin of a tradition."],
  ["The roots",
   "Among the most credited hypotheses is the one linking the Smorfia to Jewish Kabbalah, and specifically to gematria, the practice of assigning numerical values to letters to find hidden meanings in sacred texts. The hypothesis has it arriving in Naples with the Sephardic Jews expelled from Spain at the end of the fifteenth century. Further back still are the ancient books on dream interpretation, such as Artemidorus of Daldis'. What is certain is that in Naples all of this became something else: popular, comic, shameless, far closer to the street than to mysticism."],
  ["Why ninety",
   "Because ninety is how many balls the lottery has. The game was born in Genoa in the sixteenth century and legalised in the Italian states in the eighteenth; its ninety numbers gave the Smorfia its grid. Without the lottery, the Smorfia would have had no shape."],
  ["The tombola, or how a ban invented a game",
   "In 1734 in Naples, King Charles of Bourbon wanted to make the lottery official: kept clandestine, it earned the state nothing. The Dominican friar Gregorio Maria Rocco opposed him, arguing it would draw people away from prayer, all the more during Advent. They compromised: the public counter stayed shut over the Christmas weeks. Neapolitans organised at home, with hand-written numbers and a small sack to draw them from — the tombolo, the lacemaking cushion, which gave the game its name. That is how a forbidden game became the most domestic Christmas tradition there is. And that is why the ninety meanings of the Smorfia and those of the tombola are the same."],
  ["The rules of those who really believed",
   "Around the playing of dreams a set of precise, severe rules had formed. Numbers had to be played “pure”, unmixed with others; they had to be followed for three consecutive draws before being abandoned; and above all you were not to tell anyone which dream they came from, because saying it destroyed their power. These rules say a great deal: those who played knew perfectly well they were betting, and built a discipline around it to make the waiting bearable."],
  ["Beyond the ninety: the extended dictionary",
   "The ninety names are those of the tombola, but the real Smorfia is far wider: it sends every thing in the world to one of the ninety numbers, and traditional dictionaries run to thousands of entries. The trouble is they disagree. One list gives “cat” to 66, while 3 is literally 'a jatta; another gives the word “water” four different numbers, and “vinegar” ten. Fine for a book to leaf through, useless for a tool that must pick one. So a single rule was followed here for every added entry: each word goes to the canonical figure it most resembles. The snake goes to the rope around the neck, because that is its image; the staircase to the fall; fire to the little devils; the telephone to the mouth, the word that arrives from far away; the dog to the cat, because tradition gave it no number and that is the animal of the house. Where the Smorfia is silent the choice is ours, and we say so: it is nobody else's smorfia, but it is consistent with itself and never contradicts the ninety."],
  ["How a dream is read",
   "The method is simple: break the account into its figures and look each one up. Whole expressions come before single words — 47 is the dead man, but the dead man who speaks is 48, and that is a different number. Not every word has a number: the canonical Smorfia knows ninety, and of a given dream it may translate two, or none. Tradition plays five numbers at most, and it is rare to fill them."]
 ],
 sourcesTitle:"On the sources",
 sources:"The list of ninety numbers given here was assembled by cross-checking three concordant Neapolitan lists. Where sources diverge — 40 and 43 are the main cases — the majority reading was followed and flagged in a note. Local and family variants exist: no single list is the correct one, and that is a feature of oral tradition, not a defect.",
 foot:"The Neapolitan Smorfia is a piece of folk culture, not a method for predicting anything. This page documents it: it is not an invitation to gamble, and no number is more likely than any other. Gambling can be addictive."
}
};

function esc(s){
 return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderTable(){
 const t = TR[lang];
 const head = `<thead><tr><th>${esc(t.colN)}</th><th>${esc(t.colNap)}</th><th>${esc(t.colMean)}</th></tr></thead>`;
 const rows = SMORFIA.map(e=>{
  const mean = lang==='it' ? e.it : `${esc(e.it)} <span style="opacity:.7">/ ${esc(e.en)}</span>`;
  const note = lang==='it' ? e.nit : e.nen;
  return `<tr>
   <td class="n">${e.n}</td>
   <td class="nap">${esc(e.nap)}</td>
   <td class="mean">${lang==='it'?esc(mean):mean}${note?`<span class="note">${esc(note)}</span>`:''}</td>
  </tr>`;
 }).join('');
 $('table').innerHTML = head + '<tbody>' + rows + '</tbody>';
}

function applyStaticText(){
 const t = TR[lang];
 $('t-back').textContent = t.back;
 $('t-eyebrow').textContent = t.eyebrow;
 $('t-title').textContent = t.title;
 $('t-lede').textContent = t.lede;
 $('t-toolink').textContent = t.toolink;
 $('t-tabletitle').textContent = t.tabletitle;
 $('t-tablenote').textContent = t.tablenote;
 $('t-foot').textContent = t.foot;
 $('tradition').innerHTML = t.tradition
  .map(([h,p])=>`<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join('');
 $('sources-block').innerHTML =
  `<h2>${esc(t.sourcesTitle)}</h2><p class="sources">${esc(t.sources)}</p>`;
 document.documentElement.lang = lang;
 document.title = t.docTitle;
 renderTable();
}

function setLang(l){
 if(l===lang) return;
 lang = l;
 try { localStorage.setItem(LANG_KEY, l); } catch(e){}
 $('l-it').setAttribute('aria-pressed', String(l==='it'));
 $('l-en').setAttribute('aria-pressed', String(l==='en'));
 applyStaticText();
}

$('l-it').addEventListener('click', ()=>setLang('it'));
$('l-en').addEventListener('click', ()=>setLang('en'));
$('l-it').setAttribute('aria-pressed', lang==='it');
$('l-en').setAttribute('aria-pressed', lang==='en');
applyStaticText();

</script>
