<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smorfia</title>
<style>
:root{
--paper:#f7f6f2;
--paper-deep:#efeee7;
--ink:#1b201d;
--ink-soft:#4a534d;
--indigo:#33485c;
--cinnabar:#a83a2a;
--bronze:#8a8360;
--rule:rgba(27,32,29,.16);
--serif:"Palatino Linotype",Palatino,"Iowan Old Style","Book Antiqua",Georgia,serif;
--body:Georgia,"Times New Roman",serif;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--paper);
color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;
-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:38px 26px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.backlink{margin:0 0 14px}
.backlink a{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);text-decoration:none;border-bottom:1px solid transparent;transition:color .25s ease,border-color .25s ease}
.backlink a:hover{color:var(--indigo);border-bottom-color:var(--indigo)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);margin:0 0 10px}
.lang{display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:0 0 auto}
.lang button{
background:transparent;border:0;border-right:1px solid var(--rule);padding:6px 11px;cursor:pointer;
font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)
}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--indigo);color:#f2f2ec}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.06;margin:0 0 6px;letter-spacing:-.01em}
h1 .glyph{font-family:var(--serif);font-style:italic;font-size:.78em;margin-right:.28em;color:var(--indigo)}
.lede{margin:0 0 34px;color:var(--ink-soft);max-width:54ch}
.flabel{
display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
text-transform:uppercase;color:var(--bronze);margin:0 0 12px
}
footer{
margin-top:26px;font-family:var(--mono);font-size:11px;line-height:1.85;
letter-spacing:.03em;color:var(--bronze)
}
.rule{border:0;border-top:1px solid var(--rule);margin:52px 0 0}

label.field{display:block;margin-bottom:24px}
label.field > span{
display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
text-transform:uppercase;color:var(--bronze);margin:0 0 10px
}
textarea{
width:100%;min-height:150px;resize:vertical;
background:var(--paper-deep);border:1px solid var(--rule);border-radius:3px;
padding:14px 15px;font-family:var(--body);font-size:16.5px;line-height:1.6;color:var(--ink)
}
textarea:focus{outline:0;border-color:var(--indigo)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:26px 0 0}
.cast{
background:var(--ink);color:var(--paper);border:0;border-radius:3px;
padding:13px 26px;font-family:var(--serif);font-size:17px;cursor:pointer;
transition:background-color .25s ease
}
.cast:hover{background:var(--indigo)}
.cast[disabled]{opacity:.5;cursor:default}
.ghost{
background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:3px;
padding:13px 22px;font-family:var(--serif);font-size:16px;cursor:pointer
}
.ghost:hover{border-color:var(--indigo)}
.tablelink{
font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
color:var(--indigo);text-decoration:none;border-bottom:1px solid transparent
}
.tablelink:hover{border-bottom-color:var(--indigo)}

.stage{margin-top:46px}
.balls{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 34px}
.ball{
width:74px;height:74px;flex:0 0 auto;border-radius:50%;
border:1px solid var(--rule);background:var(--paper-deep);
display:flex;align-items:center;justify-content:center;
font-family:var(--serif);font-size:29px;color:var(--indigo);
opacity:0;transform:translateY(8px);
animation:pop .5s ease forwards
}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
.readings{margin:0}
.entry{border-top:1px solid var(--rule);padding:18px 0}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry .num{
font-family:var(--serif);font-size:23px;color:var(--indigo);
display:inline-block;min-width:1.9em
}
.entry .nap{font-family:var(--serif);font-size:19px}
.entry .ita{color:var(--ink-soft);font-size:15.5px}
.entry .why{
display:block;margin-top:7px;font-family:var(--mono);font-size:11px;
letter-spacing:.05em;color:var(--bronze)
}
.entry .note{margin:9px 0 0;font-size:15px;color:var(--ink-soft);line-height:1.55}
.intro{margin:0 0 26px;color:var(--ink-soft)}
.empty{
border:1px solid var(--rule);border-radius:3px;padding:22px 20px;
background:rgba(138,131,96,.05);color:var(--ink-soft);margin:0
}
.export-row{display:flex;flex-wrap:wrap;gap:9px;margin:26px 0 0;align-items:center}
.share-link,.share-btn{
font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
text-decoration:none;border:1px solid var(--rule);border-radius:2px;
padding:8px 13px;cursor:pointer;background:transparent;line-height:1
}
.share-link:hover,.share-btn:hover{border-color:var(--indigo);background:rgba(51,72,92,.05)}
@media (max-width:520px){
.wrap{padding:30px 20px 72px}
.ball{width:62px;height:62px;font-size:25px}
}
</style>
</head>

// ---------- normalizzazione e riconoscimento ----------

// Toglie accenti, apostrofi e punteggiatura: il testo del sogno e le parole del
// lessico passano di qui, così si confrontano sullo stesso piano.
function normalize(s){
 return s.toLowerCase()
  .replace(/[àáâãä]/g,'a')
  .replace(/[èéêë]/g,'e')
  .replace(/[ìíîï]/g,'i')
  .replace(/[òóôõö]/g,'o')
  .replace(/[ùúûü]/g,'u')
  .replace(/[’'`]/g,' ')
  .replace(/[^a-z0-9\s]/g,' ')
  .replace(/\s+/g,' ')
  .trim();
}

// Riduce una parola alla sua radice, togliendo le desinenze più comuni.
// Serve perché "gatti", "gatta" e "gattino" devono arrivare tutte al 3, e
// "parlava" deve valere quanto "parla". Si ferma a tre lettere per non
// accorciare troppo.
const SUFFIXES = ['issimo','issima','avamo','evamo','ivamo','mente','zione',
                  'avano','evano','ivano','ando','endo','ava','eva','iva',
                  'avo','evo','ivo','ato','ata','ito','ita','uto','uta',
                  'are','ere','ire','ano','ono','ini','ino',
                  'i','o','a','e'];
function stem(w){
 if(w.length < 4) return w;
 for(const suf of SUFFIXES){
  if(w.length - suf.length >= 3 && w.endsWith(suf)) return w.slice(0, w.length - suf.length);
 }
 return w;
}

// Due indici: uno per la forma esatta, uno per la radice. L'esatto vince
// sempre, altrimenti "nonna" e "nonno" finirebbero sullo stesso numero.
function buildIndex(lang){
 const exact = new Map(), stems = new Map();
 let maxLen = 1;
 for(const e of SMORFIA){
  for(const kw of (lang==='it' ? e.kit : e.ken)){
   // "porta!" si riconosce solo cosi' com'e': la sua radice e' quella di
   // "portare", e senza questo freno ogni "portava" darebbe la casa.
   const exactOnly = kw.endsWith('!');
   const norm = normalize(exactOnly ? kw.slice(0,-1) : kw);
   if(!norm) continue;
   const words = norm.split(' ');
   maxLen = Math.max(maxLen, words.length);
   if(!exact.has(norm)) exact.set(norm, e.n);
   if(words.length === 1 && !exactOnly){
    const st = stem(norm);
    if(!stems.has(st)) stems.set(st, e.n);
   }
  }
 }
 return {exact, stems, maxLen};
}

// Scorre il racconto una volta sola, dall'inizio alla fine, provando prima le
// espressioni lunghe: così "morto che parla" prende il 48 e si mangia le
// parole, invece di lasciare che "morto" prenda il 47.
function findNumbers(text, lang){
 const idx = buildIndex(lang);
 const words = normalize(text).split(' ').filter(Boolean);
 const found = [];
 const seen = new Set();
 let i = 0;
 while(i < words.length){
  let hit = null;
  for(let len = Math.min(idx.maxLen, words.length - i); len >= 1; len--){
   const span = words.slice(i, i+len).join(' ');
   let n = idx.exact.get(span);
   if(n === undefined && len === 1) n = idx.stems.get(stem(span));
   if(n !== undefined){ hit = {n, len, span}; break; }
  }
  if(hit){
   if(!seen.has(hit.n)){
    seen.add(hit.n);
    found.push({n:hit.n, match:hit.span, entry:SMORFIA.find(e=>e.n===hit.n)});
   }
   i += hit.len;
  } else {
   i += 1;
  }
 }
 return found;
}

 empty:"The canonical Smorfia has only ninety figures, and none of them appears in this account. I won't hand you invented numbers: try telling the dream with more concrete detail — the things, the animals, the people you saw. Note that the lexicon is richer in Italian.",
 save:"Save .txt",
 shareIntro:"Share",
 mailSubject:"My Smorfia numbers",
 exportTitle:"SMORFIA — Answer",
 exportDream:"Dream",
 exportNumbers:"Numbers",
 foot:"The Neapolitan Smorfia is a piece of folk culture, not a method for predicting anything. This tool translates words into numbers according to tradition, and stops there: it is not an invitation to gamble, and no number is more likely than any other. Gambling can be addictive. Everything happens in your browser: what you write is never sent or stored anywhere."
}
};

const $ = id=>document.getElementById(id);
let lang = 'it';
let lastResult = null;

const LANG_KEY = 'divinazioni_lang';
try { const saved = localStorage.getItem(LANG_KEY); if(saved==='it'||saved==='en') lang = saved; } catch(e){}

function applyStaticText(){
 const t = TR[lang];
 $('t-back').textContent = t.back;
 $('t-eyebrow').textContent = t.eyebrow;
 $('t-title').textContent = t.title;
 $('t-lede').textContent = t.lede;
 $('t-qlabel').textContent = t.qlabel;
 $('q').placeholder = t.qplaceholder;
 $('cast').textContent = t.cast;
 $('again').textContent = t.again;
 $('t-tablelink').textContent = t.tablelink;
 $('t-foot').textContent = t.foot;
 document.documentElement.lang = lang;
 document.title = t.docTitle;
 if(lastResult) render(lastResult.text, lastResult.found, lastResult.total);
}

function setLang(l){
 if(l===lang) return;
 lang = l;
 try { localStorage.setItem(LANG_KEY, l); } catch(e){}
 $('l-it').setAttribute('aria-pressed', String(l==='it'));
 $('l-en').setAttribute('aria-pressed', String(l==='en'));
 // il lessico cambia con la lingua, quindi il responso va ricalcolato
 if(lastResult){
  const all = findNumbers(lastResult.text, lang);
  lastResult.found = all.slice(0, MAX_NUMBERS);
  lastResult.total = all.length;
 }
 applyStaticText();
}

function esc(s){
 return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function buildExportText(text, found){
 const t = TR[lang];
 const lines = [t.exportTitle, ''];
 lines.push(t.exportDream + ': ' + text.trim(), '');
 lines.push(t.exportNumbers + ': ' + found.map(f=>f.n).join(' · '), '');
 for(const f of found){
  const e = f.entry;
  lines.push(`${e.n} — ${e.nap} — ${lang==='it'?e.it:e.en}  (${f.match})`);
 }
 lines.push('', PAGE_URL);
 return lines.join('\n');
}

function shareSnippet(found){
 const nums = found.map(f=>f.n).join(' · ');
 const label = lang==='it' ? 'I miei numeri della Smorfia' : 'My Smorfia numbers';
 return `${label}: ${nums} — ${PAGE_URL}`;
}

function render(text, found, total){
 const t = TR[lang];
 const stage = $('stage');
 stage.innerHTML = '';

 if(!found.length){
  stage.innerHTML = `<h3 class="flabel">${esc(t.emptyTitle)}</h3><p class="empty">${esc(t.empty)}</p>`;
  return;
 }

 const balls = found.map((f,i)=>
  `<div class="ball" style="animation-delay:${i*0.12}s">${f.n}</div>`).join('');

 const intro = found.length===1
  ? t.introOne
  : t.introMany.replace('{n}', found.length);
 // solo se ne sono state davvero scartate, altrimenti sarebbe una bugia
 const introMax = total > found.length ? ` ${t.introMax}` : '';

 const rows = found.map(f=>{
  const e = f.entry;
  const note = lang==='it' ? e.nit : e.nen;
  return `<div class="entry">
   <span class="num">${e.n}</span><span class="nap">${esc(e.nap)}</span>
   <span class="ita"> &mdash; ${esc(lang==='it'?e.it:e.en)}</span>
   <span class="why">${esc(t.why.replace('{w}', f.match))}</span>
   ${note?`<p class="note">${esc(note)}</p>`:''}
  </div>`;
 }).join('');

 const snippet = encodeURIComponent(shareSnippet(found));
 stage.innerHTML = `
  <h3 class="flabel">${esc(t.resultTitle)}</h3>
  <div class="balls">${balls}</div>
  <p class="intro">${esc(intro + introMax)}</p>
  <div class="readings">${rows}</div>
  <div class="export-row">
   <button type="button" class="share-btn" id="save-txt">${esc(t.save)}</button>
   <a class="share-link" target="_blank" rel="noopener" href="https://wa.me/?text=${snippet}">WhatsApp</a>
   <a class="share-link" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(PAGE_URL)}&text=${snippet}">Telegram</a>
   <a class="share-link" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${snippet}">X</a>
   <a class="share-link" href="mailto:?subject=${encodeURIComponent(t.mailSubject)}&body=${encodeURIComponent(buildExportText(text, found))}">Email</a>
  </div>`;

 $('save-txt').addEventListener('click', ()=>{
  const blob = new Blob([buildExportText(text, found)], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'smorfia.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
 });
}

function run(){
 const text = $('q').value;
 if(!text.trim()){
  $('stage').innerHTML = `<p class="empty">${esc(TR[lang].needText)}</p>`;
  return;
 }
 const all = findNumbers(text, lang);
 const found = all.slice(0, MAX_NUMBERS);
 lastResult = {text, found, total: all.length};
 render(text, found, all.length);
 $('again').style.display = '';
}

$('l-it').addEventListener('click', ()=>setLang('it'));
$('l-en').addEventListener('click', ()=>setLang('en'));
$('cast').addEventListener('click', run);
$('again').addEventListener('click', run);

$('l-it').setAttribute('aria-pressed', lang==='it');
$('l-en').setAttribute('aria-pressed', lang==='en');
applyStaticText();

</script>
</body>
</html>
