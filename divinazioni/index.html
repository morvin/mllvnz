:root{
--paper:#f7f6f2;
--paper-deep:#efeee7;
--ink:#1b201d;
--ink-soft:#4a534d;
--indigo:#33485c;
--cinnabar:#a83a2a;
--bronze:#8a8360;
--rule:rgba(27,32,29,.16);
--serif:"Palatino Linotype",Palatino,"Iowan Old Style","Book Antiqua",Georgia,serif;
--body:Georgia,"Times New Roman",serif;
--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
--runic:'Noto Sans Runic',var(--serif);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--paper);
color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.62;
-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:38px 26px 96px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);margin:0 0 10px}
.lang{display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:0 0 auto}
.lang button{
background:transparent;border:0;border-right:1px solid var(--rule);padding:6px 11px;cursor:pointer;
font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)
}
.lang button:last-child{border-right:0}
.lang button[aria-pressed="true"]{background:var(--indigo);color:#f2f2ec}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.06;margin:0 0 6px;letter-spacing:-.01em}
h1 .glyph{font-family:var(--serif);font-style:italic;font-size:.78em;margin-right:.28em;color:var(--indigo)}
.lede{margin:0 0 44px;color:var(--ink-soft);max-width:54ch}

.flabel{
display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
text-transform:uppercase;color:var(--bronze);margin:0 0 18px
}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:0 0 12px}
.tool{
display:flex;gap:20px;align-items:flex-start;
border:1px solid var(--rule);border-radius:3px;padding:24px 22px;
text-decoration:none;color:inherit;background:transparent;
transition:border-color .25s ease,background-color .25s ease,transform .25s ease
}
.tool:hover{border-color:var(--indigo);background:rgba(51,72,92,.045);transform:translateY(-2px)}
.tool:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.tool .mark{
flex:0 0 auto;width:46px;height:46px;display:flex;align-items:center;justify-content:center;
border:1px solid var(--rule);border-radius:2px;background:var(--paper-deep);
color:var(--indigo);font-size:24px;line-height:1
}
.tool .mark.runic{font-family:var(--runic);font-size:23px}
.tool .mark.star{font-family:var(--serif);font-style:italic}
.tool .mark.num{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.tool .body{min-width:0}
.tool h2{
font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.15;
margin:0 0 6px;letter-spacing:-.01em
}
.tool p{margin:0 0 12px;color:var(--ink-soft);font-size:15.5px;line-height:1.52}
.tool .meta{
font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
color:var(--bronze);margin:0
}
.tool .go{
display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--indigo);border-bottom:1px solid transparent;transition:border-color .25s ease
}
.tool:hover .go{border-bottom-color:var(--indigo)}

.tool.soon{opacity:.55;pointer-events:none}
.tool.soon .mark{color:var(--bronze)}

.rule{border:0;border-top:1px solid var(--rule);margin:52px 0 0}
footer{
margin-top:26px;font-family:var(--mono);font-size:11px;line-height:1.85;
letter-spacing:.03em;color:var(--bronze)
}

@media (max-width:520px){
.wrap{padding:30px 20px 72px}
.tool{padding:20px 18px;gap:16px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
<p class="eyebrow" id="t-eyebrow"></p>
<div class="lang" role="group" aria-label="Lingua / Language">
<button type="button" id="l-it" aria-pressed="true">IT</button>
<button type="button" id="l-en" aria-pressed="false">EN</button>
</div>
</div>

<h1><span class="glyph">✦</span><span id="t-title"></span></h1>
<p class="lede" id="t-lede"></p>

<span class="flabel" id="t-choose"></span>
<div class="tools" id="tools"></div>

<hr class="rule">
<footer id="t-foot"></footer>

</div>

<script>
// Aggiungere una divinazione = aggiungere una voce qui, nient'altro.
// `soon:true` la mostra in grigio e non cliccabile (per annunciare qualcosa
// che non e' ancora pronto); finche' non serve, lasciarlo fuori.
const TOOLS = [
 {
  href:'tarot.html',
  glyph:'✦', markClass:'star',
  it:{
   name:'Tarocchi',
   desc:'Ventidue Arcani Maggiori, dritti o capovolti. Lettura a una carta o a tre carte, con un commento composto al momento.',
   meta:'22 Arcani Maggiori · 7 stili di mazzo'
  },
  en:{
   name:'Tarot',
   desc:'Twenty-two Major Arcana, upright or reversed. One-card or three-card reading, with a commentary composed on the spot.',
   meta:'22 Major Arcana · 7 deck styles'
  }
 },
 {
  href:'smorfia.html',
  glyph:'90', markClass:'num',
  it:{
   name:'Smorfia',
   desc:'Racconta un sogno: la Smorfia napoletana ne riconosce le figure e le traduce nei numeri della tradizione. Al massimo cinque, spesso meno.',
   meta:'90 numeri · Tradizione napoletana'
  },
  en:{
   name:'Smorfia',
   desc:'Tell a dream: the Neapolitan Smorfia recognises its figures and turns them into the numbers of tradition. Five at most, often fewer.',
   meta:'90 numbers · Neapolitan tradition'
  }
 },
 {
  href:'rune.html',
  glyph:'ᚠ', markClass:'runic',
  it:{
   name:'Rune',
   desc:'Le ventiquattro rune del Futhark Antico, dritte o capovolte. Lettura a una runa o a tre rune, nello stesso spirito.',
   meta:'24 rune · Futhark Antico'
  },
  en:{
   name:'Runes',
   desc:'The twenty-four runes of the Elder Futhark, upright or reversed. One-rune or three-rune reading, in the same spirit.',
   meta:'24 runes · Elder Futhark'
  }
 }
];

const TR = {
it:{
 eyebrow:"Divinazioni · Strumenti di consultazione",
 title:"Divinazioni",
 lede:"Piccoli strumenti di consultazione, da usare come si usa uno specchio: non per sapere cosa accadrà, ma per guardare da un'altra angolazione quello che già sai. Nessun account, nessuna registrazione, niente che esca dal tuo browser.",
 choose:"Scegli lo strumento",
 go:"Apri",
 soon:"In arrivo",
 foot:"Ogni strumento funziona interamente nel tuo browser: le letture sono composte da un motore di testo locale, non da un servizio esterno, e nulla di quello che scrivi viene inviato o salvato altrove. Vanno prese per quello che sono, un commento, mai una previsione."
},
en:{
 eyebrow:"Divinations · Consultation tools",
 title:"Divinations",
 lede:"Small consultation tools, to be used the way one uses a mirror: not to know what will happen, but to look at what you already know from another angle. No account, no sign-up, nothing that leaves your browser.",
 choose:"Choose a tool",
 go:"Open",
 soon:"Coming soon",
 foot:"Each tool runs entirely in your browser: readings are composed by a local text engine, not by an external service, and nothing you type is sent or stored anywhere else. Take them for what they are — a commentary, never a prediction."
}
};

const $ = id=>document.getElementById(id);
let lang = 'it';

// La lingua scelta qui vale anche per gli strumenti, cosi' chi arriva dal
// portale in inglese non si ritrova i tarocchi in italiano.
const LANG_KEY = 'divinazioni_lang';
try { const saved = localStorage.getItem(LANG_KEY); if(saved==='it'||saved==='en') lang = saved; } catch(e){}

function renderTools(){
 $('tools').innerHTML = TOOLS.map(tool=>{
  const c = tool[lang];
  const soon = tool.soon;
  const tag = soon ? 'div' : 'a';
  const href = soon ? '' : ` href="${tool.href}"`;
  return `<${tag} class="tool${soon?' soon':''}"${href}>
   <span class="mark ${tool.markClass}" aria-hidden="true">${tool.glyph}</span>
   <span class="body">
    <h2>${c.name}</h2>
    <p>${c.desc}</p>
    <p class="meta">${c.meta}</p>
    <span class="go">${soon ? TR[lang].soon : TR[lang].go} →</span>
   </span>
  </${tag}>`;
 }).join('');
}

function applyStaticText(){
 const t = TR[lang];
 $('t-eyebrow').textContent = t.eyebrow;
 $('t-title').textContent = t.title;
 $('t-lede').textContent = t.lede;
 $('t-choose').textContent = t.choose;
 $('t-foot').textContent = t.foot;
 document.documentElement.lang = lang;
 document.title = t.title;
 renderTools();
}

function setLang(l){
 if(l===lang) return;
 lang = l;
 try { localStorage.setItem(LANG_KEY, l); } catch(e){}
 $('l-it').setAttribute('aria-pressed', String(l==='it'));
 $('l-en').setAttribute('aria-pressed', String(l==='en'));
 applyStaticText();
}

$('l-it').addEventListener('click', ()=>setLang('it'));
$('l-en').addEventListener('click', ()=>setLang('en'));

$('l-it').setAttribute('aria-pressed', String(lang==='it'));
$('l-en').setAttribute('aria-pressed', String(lang==='en'));
applyStaticText();
</script>
</body>
</html>
